<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D 结构式 vs 3D 构象 — chemfigstudio</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/compare.css">
</head>
<body class="compare-page">

  <header class="topbar">
    <div class="brand">
      <strong>chemfigstudio</strong>
      <span class="tag" data-i18n="compare.title">2D 结构式 vs 3D 构象</span>
    </div>
    <div class="actions">
      <button id="cmp-back" data-i18n="compare.back">返回主界面</button>
      <select id="cmp-language" title="language"></select>
    </div>
  </header>

  <main class="cmp-main">
    <section class="panel cmp-controls">
      <label class="field cmp-grow">
        <span data-i18n="compare.smiles">SMILES</span>
        <input id="cmp-smiles" type="text" spellcheck="false" placeholder="C1CCCCC1">
      </label>
      <div class="actions">
        <button id="cmp-single" class="primary" data-i18n="compare.showOne">只看这一个</button>
        <button id="cmp-reset" data-i18n="compare.reset">恢复全部示例</button>
      </div>
      <div class="actions cmp-toggles">
        <label class="check"><input id="cmp-spin" type="checkbox">
          <span data-i18n="compare.spin">自动旋转</span></label>
        <label class="check"><input id="cmp-labels" type="checkbox">
          <span data-i18n="compare.labels">元素符号</span></label>
      </div>
      <p class="hint" data-i18n="compare.hint">
        左边是本工具的主场景（课本风格结构式），右边是同一个分子的真实 3D 构象。
        拖动右边可以旋转。
      </p>
      <p class="status" id="cmp-status"></p>
    </section>

    <div id="cmp-rows" class="cmp-rows"></div>
  </main>

  <script src="/static/vendor/3Dmol-min.js"></script>
  <script src="/static/compare.js"></script>
</body>
</html>
